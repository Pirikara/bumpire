<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Bumpire</title>
  <desc id="desc">Agentic dependency updates with deterministic verification</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".42"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".65"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <ellipse cx="255" cy="160" rx="280" ry="250" fill="url(#glow)"/>
  <ellipse cx="1060" cy="10" rx="330" ry="230" fill="url(#glow)" opacity=".45"/>

  <g transform="translate(104 62)" filter="url(#shadow)">
    <path d="M96 0 179 48v96l-83 48-83-48V48Z" fill="#0f172a" stroke="url(#accent)" stroke-width="5"/>
    <path d="M96 28 151 60v64l-55 32-55-32V60Z" fill="url(#accent)" opacity=".13"/>
    <path d="M96 137V54m0 0L65 84m31-30 31 30" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <path d="m61 122 22 21 48-48" fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(345 87)">
    <text x="0" y="73" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="82" font-weight="800" letter-spacing="7">BUMPIRE</text>
    <rect x="2" y="96" width="690" height="2" rx="1" fill="url(#accent)" opacity=".7"/>
    <text x="2" y="139" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="23" font-weight="450" letter-spacing="1.2">AGENTIC UPDATES. DETERMINISTIC DECISIONS.</text>
  </g>

  <circle cx="1131" cy="264" r="4" fill="#22d3ee"/>
  <circle cx="1109" cy="264" r="4" fill="#818cf8"/>
  <circle cx="1087" cy="264" r="4" fill="#c084fc"/>
</svg>
