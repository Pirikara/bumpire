[project]
name = "bumpire"
version = "0.10.0"
description = "Bumpire: agentic dependency updates with deterministic verification"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "openai-agents[litellm]>=0.19.0,<0.20",
  "pydantic>=2.11.0,<3",
]

[project.urls]
Homepage = "https://github.com/Pirikara/bumpire"
Repository = "https://github.com/Pirikara/bumpire"
Issues = "https://github.com/Pirikara/bumpire/issues"

[project.scripts]
bumpire = "bumpire.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bumpire"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "driver: exercises built-in driver contracts in Docker",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
